<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة تحكم بنيان</title>
<meta name="description" content="نموذج لوحة تحكم لإدارة مشاريع الموقع ومحتواه وبيانات التواصل، من تصميم F9.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Readex+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app shell. Top bar with publish action, tab strip, then editor column beside a live preview of the public site. */
:root{
  --bg:#F2F0F3;--panel:#fff;--ink:#1E1722;--mut:#6E6574;--line:#E3DEE6;--brand:#7B1150;--brand-d:#5E0C3E;--brand-l:#F6E8F0;
  --ok:#1E8A5A;--okl:#DDF3E8;--wip:#B26A0A;--wipl:#FCEBCF;--err:#B3261E;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;--f-body:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);line-height:1.7;font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #E7A23B;outline-offset:2px}
svg{display:block}
.ic{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shell{max-width:1240px;margin:0 auto}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 0}
.logo{width:42px;height:42px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:1.2rem;flex:none}
.top h1{font-family:var(--f-display);font-size:1.1rem;font-weight:600;line-height:1.3}
.top small{color:var(--mut);display:block;font-size:.8rem;font-weight:400}
.acts{margin-inline-start:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dirty{font-size:.78rem;background:var(--wipl);color:var(--wip);padding:1px 12px;border-radius:99px;font-weight:700}
.dirty.clean{background:var(--okl);color:var(--ok)}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 20px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:700;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);color:#fff}
.btn.danger{color:var(--err)}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.btn svg{width:18px;height:18px}
.demo{background:#1E1722;color:#E8DFEA;font-size:.78rem;text-align:center;padding:4px 12px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 18px;font-weight:500;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:700}

.app{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.card h2{font-family:var(--f-display);font-size:1rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}

.plist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.pitem{display:flex;align-items:center;gap:12px;text-align:start;padding:8px 10px;border:1.5px solid var(--line);border-radius:14px;background:#fff;width:100%}
.pitem.on{border-color:var(--brand);background:var(--brand-l)}
.pitem .th{width:44px;height:44px;border-radius:10px;flex:none;overflow:hidden;position:relative}
.pitem b{display:block;font-size:.93rem;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem small{color:var(--mut)}
.pitem .tx{min-width:0;flex:1}
.st{font-size:.72rem;font-weight:700;padding:0 10px;border-radius:99px;flex:none}
.st.done{background:var(--okl);color:var(--ok)}
.st.wip{background:var(--wipl);color:var(--wip)}

.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;font-weight:500;font-size:.88rem}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;background:#fff;font-weight:400;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(123,17,80,.12)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.lbl{font-weight:500;font-size:.88rem;margin-bottom:6px}
.gal{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.gal .im{position:relative;width:68px;height:68px;border-radius:12px;overflow:hidden;border:2px solid transparent}
.gal .im.first{border-color:var(--brand)}
.gal .im button.pick{position:absolute;inset:0;border:0;background:none}
.gal .im .rm{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:.8rem;line-height:1;display:grid;place-items:center}
.gal .im em{position:absolute;bottom:0;inset-inline:0;background:var(--brand);color:#fff;font-size:.62rem;font-style:normal;text-align:center}
.gal label.add{width:68px;height:68px;border-radius:12px;border:1.5px dashed #BDB3C2;display:grid;place-items:center;color:var(--mut);cursor:pointer;text-align:center;font-size:.72rem;line-height:1.3}
.gal label.add svg{width:20px;height:20px;margin:0 auto 2px}
.gal input{position:absolute;opacity:0;width:1px;height:1px}
.hint{font-size:.78rem;color:var(--mut);margin:-8px 0 14px}

.map{position:relative;height:190px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);margin-bottom:12px;touch-action:none;cursor:crosshair;background:#EAF0E8}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:30px;height:38px;translate:-50% -100%;color:var(--brand);filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));pointer-events:none}
.pin svg{width:100%;height:100%}
.maplbl{position:absolute;bottom:6px;inset-inline-start:8px;font-size:.7rem;background:rgba(255,255,255,.85);padding:0 8px;border-radius:6px;color:var(--mut)}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.row .grow{margin-inline-start:auto}

/* preview */
.pvh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--mut);font-size:.82rem}
.live{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--ok)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.browser{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -40px rgba(30,23,34,.5)}
.bar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#F7F5F8;border-bottom:1px solid var(--line)}
.bar i{width:10px;height:10px;border-radius:50%;background:#D9D3DD}
.bar span{margin-inline-start:10px;flex:1;background:#fff;border:1px solid var(--line);border-radius:99px;font-size:.74rem;color:var(--mut);padding:0 14px;direction:ltr;text-align:left}
.site{height:620px;overflow-y:auto;scroll-behavior:smooth;background:#fff}
.pv-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid #eee;gap:12px}
.pv-nav b{font-family:var(--f-display);color:var(--brand);display:flex;align-items:center;gap:10px}
.pv-nav b i{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.85rem}
.pv-nav span{font-size:.78rem;color:var(--mut)}
.pv-hero{background:linear-gradient(135deg,#4A0A30,#7B1150 70%);color:#fff;padding:48px 24px}
.pv-hero h3{font-family:var(--f-display);font-size:1.7rem;line-height:1.35;font-weight:600;max-width:20ch;margin-bottom:10px}
.pv-hero p{color:rgba(255,255,255,.8);max-width:46ch;margin-bottom:20px}
.pv-hero a{display:inline-block;background:#fff;color:var(--brand);font-weight:700;padding:8px 22px;border-radius:10px;font-size:.9rem}
.pv-sec{padding:34px 22px}
.pv-sec h4{font-family:var(--f-display);font-size:1.25rem;margin-bottom:4px}
.pv-sec>small{color:var(--mut);display:block;margin-bottom:18px}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pv-card{border:1px solid #eee;border-radius:14px;overflow:hidden;background:#fff}
.pv-cv{height:110px;position:relative}
.pv-cv .st{position:absolute;top:8px;inset-inline-start:8px}
.pv-card div.tx{padding:12px 14px}
.pv-card b{display:block;font-size:.95rem;line-height:1.4}
.pv-card small{color:var(--mut)}
.pv-contact{background:#F8F4F7;padding:30px 22px;display:grid;gap:6px;font-size:.92rem}
.pv-contact b{font-family:var(--f-display);font-size:1.1rem;color:var(--brand);margin-bottom:6px}
.pv-contact span{display:flex;gap:10px}
.pv-contact span em{font-style:normal;color:var(--mut);min-width:64px}
.empty{color:var(--mut);padding:22px;text-align:center;border:1.5px dashed var(--line);border-radius:14px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:12px;font-weight:500;z-index:30;box-shadow:0 18px 30px -12px rgba(0,0,0,.4)}
.toast[hidden]{display:none}

@media(max-width:1020px){
  .app{grid-template-columns:minmax(0,1fr)}
  .site{height:520px}
}
@media(max-width:520px){
  .g2,.g3{grid-template-columns:1fr}
  .acts{width:100%}
  .acts .btn{flex:1}
  .pv-hero h3{font-size:1.4rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="ext" viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></symbol>
  <symbol id="img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="pin" viewBox="0 0 24 30"><path fill="currentColor" d="M12 0C6 0 1.500 4.500 1.500 10.200 1.500 17 12 30 12 30s10.500-13 10.500-19.800C22.500 4.500 18 0 12 0z"/><circle cx="12" cy="10" r="4" fill="#fff"/></symbol>
  <symbol id="bld" viewBox="0 0 40 40"><path fill="rgba(255,255,255,.28)" d="M6 36V14l9-5v27H6zm11 0V4l12 6v26H17zm14 0V18l5 3v15h-5z"/></symbol>
</svg>

<div class="demo">نموذج تجريبي من F9: التعديلات هنا للتجربة فقط ولا تُحفظ</div>
<div class="shell">
  <header class="top">
    <div class="logo">ب</div>
    <div><h1>لوحة التحكم</h1><small>شركة بنيان للمقاولات (نموذج)</small></div>
    <div class="acts">
      <span class="dirty clean" id="dirty">كل شيء منشور</span>
      <a class="btn" href="#site" id="viewSite"><svg class="ic"><use href="#ext"/></svg>عرض الموقع</a>
      <button class="btn pri" type="button" id="publish">حفظ ونشر</button>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" data-t="projects" class="on" role="tab">المشاريع</button>
    <button type="button" data-t="content" role="tab">محتوى الصفحة</button>
    <button type="button" data-t="contact" role="tab">التواصل</button>
  </div>

  <div class="app">
    <section class="card" id="editor" aria-live="polite"></section>
    <section id="previewCol">
      <div class="pvh"><span class="live"><i></i>معاينة مباشرة للموقع</span><span>تتحدث أثناء الكتابة</span></div>
      <div class="browser">
        <div class="bar"><i></i><i></i><i></i><span>bunyan-demo.com</span></div>
        <div class="site" id="site"></div>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const CATS={res:"سكني",com:"تجاري",inf:"بنية تحتية",fin:"تشطيبات"};
const STAT={done:"منجز",wip:"قيد التنفيذ"};
const GRAD={res:["#7B1150","#C0568F"],com:["#2B4C7E","#6C97D1"],inf:["#2F6B4F","#78B596"],fin:["#8A5A1B","#D8A95B"]};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S={
  projects:[
    {id:1,name:"مجمع الياسمين السكني",status:"done",cat:"res",city:"جدة",year:"2024",desc:"٣٦ وحدة سكنية على أربعة أدوار مع مواقف وحدائق مشتركة.",images:[],lat:21.58,lng:39.14},
    {id:2,name:"برج الأعمال التجاري",status:"wip",cat:"com",city:"جدة",year:"2026",desc:"برج مكاتب من اثني عشر دوراً بواجهة زجاجية.",images:[],lat:21.55,lng:39.17},
    {id:3,name:"طريق الخدمات الشمالي",status:"done",cat:"inf",city:"مكة المكرمة",year:"2023",desc:"تنفيذ طريق خدمات بطول ٤ كم مع تصريف أمطار.",images:[],lat:21.62,lng:39.12},
    {id:4,name:"تشطيب فلل حي الروضة",status:"wip",cat:"fin",city:"جدة",year:"2026",desc:"تشطيب كامل لست فلل بمواصفات متفق عليها.",images:[],lat:21.57,lng:39.16}],
  content:{company:"بنيان للمقاولات",title:"نبني بجودة تدوم، وبسلامة تطمئن لها",sub:"مقاولات وتطوير عمراني بأعلى معايير الجودة والسلامة.",cta:"اطلب عرض سعر"},
  contact:{phone:"0500000000",wa:"966500000000",email:"info@bunyan-demo.com",addr:"جدة، طريق الملك، مبنى ٢٠",hours:"السبت إلى الخميس، ٨ ص إلى ٥ م"}
};
let pub=JSON.stringify(S),tab="projects",sel=1,nid=10;
const proj=()=>S.projects.find(p=>p.id===sel);

function coverStyle(p){
  if(p.images[0])return `background:url(${p.images[0]}) center/cover`;
  const g=GRAD[p.cat]||GRAD.res;return `background:linear-gradient(145deg,${g[0]},${g[1]})`}
const bldg=p=>p.images[0]?"":`<svg viewBox="0 0 40 40" style="position:absolute;inset:0;width:100%;height:100%;padding:18%"><use href="#bld"/></svg>`;

function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}
function markDirty(){const d=JSON.stringify(S)!==pub;const e=$("#dirty");e.textContent=d?"تغييرات غير منشورة":"كل شيء منشور";e.classList.toggle("clean",!d)}

/* ---------- preview ---------- */
function renderPreview(){
  const c=S.content,k=S.contact;
  $("#site").innerHTML=`
  <div class="pv-nav"><b><i>${esc(c.company.trim().charAt(0)||"ش")}</i>${esc(c.company)}</b><span>من نحن · خدماتنا · مشاريعنا · تواصل</span></div>
  <div class="pv-hero" id="pvTop"><h3>${esc(c.title)}</h3><p>${esc(c.sub)}</p><a>${esc(c.cta)}</a></div>
  <div class="pv-sec" id="pvProjects"><h4>مشاريعنا</h4><small>سجل أعمالنا</small>
    ${S.projects.length?`<div class="pv-grid">${S.projects.map(p=>`<div class="pv-card"><div class="pv-cv" style="${coverStyle(p)}">${bldg(p)}<span class="st ${p.status}">${STAT[p.status]}</span></div><div class="tx"><b>${esc(p.name||"مشروع بدون اسم")}</b><small>${esc(p.city)}${p.year?" · "+esc(p.year):""} · ${CATS[p.cat]}</small></div></div>`).join("")}</div>`:'<div class="empty">لا توجد مشاريع بعد.</div>'}
  </div>
  <div class="pv-contact" id="pvContact"><b>تواصل معنا</b>
    <span><em>الجوال</em>${esc(k.phone)}</span><span><em>واتساب</em>${esc(k.wa)}</span><span><em>البريد</em>${esc(k.email)}</span><span><em>العنوان</em>${esc(k.addr)}</span><span><em>الدوام</em>${esc(k.hours)}</span></div>`;
}
function scrollPv(id){const s=$("#site"),e=document.getElementById(id);if(e)s.scrollTo({top:e.offsetTop-50})}

/* ---------- editor ---------- */
function renderEditor(){
  if(tab==="projects")return editProjects();
  if(tab==="content")return editContent();
  editContact()}

function editProjects(){
  const p=proj();
  $("#editor").innerHTML=`
  <h2>المشاريع <button class="btn" type="button" id="addP"><svg class="ic"><use href="#plus"/></svg>إضافة مشروع</button></h2>
  <div class="plist" id="plist">${S.projects.map(x=>pitem(x)).join("")}</div>
  ${p?projForm(p):'<div class="empty">اختر مشروعاً للتعديل أو أضف مشروعاً جديداً.</div>'}`;
  $("#addP").onclick=()=>{const n={id:nid++,name:"",status:"wip",cat:"res",city:"جدة",year:String(new Date().getFullYear()),desc:"",images:[],lat:21.55,lng:39.17,isNew:1};S.projects.unshift(n);sel=n.id;renderAll();scrollPv("pvProjects");$("#pn").focus()};
  $("#plist").onclick=e=>{const b=e.target.closest("[data-id]");if(b){sel=+b.dataset.id;renderEditor();scrollPv("pvProjects")}};
  if(p)bindProj(p)}
function pitem(x){return `<button type="button" class="pitem ${x.id===sel?"on":""}" data-id="${x.id}"><span class="th" style="${coverStyle(x)};position:relative">${bldg(x)}</span><span class="tx"><b>${esc(x.name||"مشروع جديد")}</b><small>${esc(x.city)} · ${CATS[x.cat]}</small></span><span class="st ${x.status}">${STAT[x.status]}</span></button>`}
function opts(o,v){return Object.entries(o).map(([k,l])=>`<option value="${k}" ${k===v?"selected":""}>${l}</option>`).join("")}
function projForm(p){return `
  <label class="fld" for="pn">اسم المشروع<input id="pn" value="${esc(p.name)}" placeholder="مثال: مجمع النخيل السكني"></label>
  <div class="g3">
    <label class="fld" for="ps">الحالة<select id="ps">${opts(STAT,p.status)}</select></label>
    <label class="fld" for="pc">التصنيف<select id="pc">${opts(CATS,p.cat)}</select></label>
    <label class="fld" for="py">السنة<input id="py" value="${esc(p.year)}" inputmode="numeric"></label>
  </div>
  <label class="fld" for="pcity">المدينة<input id="pcity" value="${esc(p.city)}"></label>
  <label class="fld" for="pd">وصف المشروع<textarea id="pd">${esc(p.desc)}</textarea></label>
  <div class="lbl">معرض الصور</div>
  <div class="gal" id="gal">${p.images.map((im,i)=>`<div class="im ${i?"":"first"}"><span style="position:absolute;inset:0;background:url(${im}) center/cover"></span><button class="pick" type="button" data-pick="${i}" aria-label="اجعلها الغلاف"></button><button class="rm" type="button" data-rm="${i}" aria-label="حذف الصورة">×</button>${i?"":"<em>الغلاف</em>"}</div>`).join("")}
    <label class="add" for="pf"><span><svg class="ic"><use href="#up"/></svg>أضف صورة</span></label><input id="pf" type="file" accept="image/*" multiple></div>
  <p class="hint">الصورة الأولى هي غلاف المشروع. اضغط على أي صورة لتصبح الغلاف.</p>
  <div class="lbl">موقع المشروع</div>
  <div class="map" id="map"><svg class="bg" viewBox="0 0 400 190" preserveAspectRatio="none"><rect width="400" height="190" fill="#E7EEE4"/><path d="M0 120C80 100 160 140 260 110S360 60 400 70" stroke="#fff" stroke-width="14" fill="none"/><path d="M90 0L130 190M250 0L210 190M0 40H400" stroke="#fff" stroke-width="7" fill="none"/><path d="M300 190C310 150 350 140 400 150V190z" fill="#CFE3EE"/></svg><div class="pin" id="pin"><svg viewBox="0 0 24 30"><use href="#pin"/></svg></div><span class="maplbl">اضغط أو اسحب الدبوس لتحديد الموقع</span></div>
  <div class="g2"><label class="fld" for="plat">خط العرض<input id="plat" value="${p.lat}" inputmode="decimal"></label><label class="fld" for="plng">خط الطول<input id="plng" value="${p.lng}" inputmode="decimal"></label></div>
  <div class="row"><button class="btn pri" type="button" id="saveP">حفظ المشروع</button><button class="btn" type="button" id="cancelP">إلغاء</button><button class="btn danger grow" type="button" id="delP">حذف</button></div>`}

const LAT=[21.40,21.70],LNG=[39.05,39.30];
function placePin(p){const x=(p.lng-LNG[0])/(LNG[1]-LNG[0]),y=1-(p.lat-LAT[0])/(LAT[1]-LAT[0]);const pin=$("#pin");pin.style.left=Math.min(100,Math.max(0,x*100))+"%";pin.style.top=Math.min(100,Math.max(0,y*100))+"%"}
function bindProj(p){
  const sync=()=>{renderPreview();markDirty();const it=document.querySelector(`.pitem[data-id="${p.id}"]`);if(it)it.outerHTML=pitem(p)};
  const bind=(id,k)=>$("#"+id).addEventListener("input",e=>{p[k]=e.target.value;sync()});
  bind("pn","name");bind("ps","status");bind("pc","cat");bind("py","year");bind("pcity","city");bind("pd","desc");
  placePin(p);
  const map=$("#map");let drag=false;
  const setFrom=e=>{const r=map.getBoundingClientRect();const fx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),fy=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
    p.lng=+(LNG[0]+fx*(LNG[1]-LNG[0])).toFixed(5);p.lat=+(LAT[1]-fy*(LAT[1]-LAT[0])).toFixed(5);$("#plat").value=p.lat;$("#plng").value=p.lng;placePin(p);markDirty()};
  map.addEventListener("pointerdown",e=>{drag=true;map.setPointerCapture(e.pointerId);setFrom(e)});
  map.addEventListener("pointermove",e=>{if(drag)setFrom(e)});
  map.addEventListener("pointerup",()=>drag=false);
  const ll=()=>{const a=parseFloat($("#plat").value),b=parseFloat($("#plng").value);if(!isNaN(a)&&!isNaN(b)){p.lat=a;p.lng=b;placePin(p);markDirty()}};
  $("#plat").addEventListener("input",ll);$("#plng").addEventListener("input",ll);
  $("#pf").addEventListener("change",e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{p.images.push(r.result);editProjects();renderPreview();markDirty()};r.readAsDataURL(f)})});
  $("#gal").addEventListener("click",e=>{
    const rm=e.target.closest("[data-rm]"),pk=e.target.closest("[data-pick]");
    if(rm){p.images.splice(+rm.dataset.rm,1)}else if(pk){const i=+pk.dataset.pick;p.images.unshift(p.images.splice(i,1)[0])}else return;
    editProjects();renderPreview();markDirty()});
  $("#saveP").onclick=()=>{delete p.isNew;if(!p.name.trim()){toast("اكتب اسم المشروع أولاً");$("#pn").focus();return}toast("تم حفظ المشروع كمسودة. اضغط حفظ ونشر ليظهر في الموقع.")};
  $("#cancelP").onclick=()=>{const old=JSON.parse(pub).projects.find(x=>x.id===p.id);
    if(old)S.projects[S.projects.findIndex(x=>x.id===p.id)]=old;else{S.projects=S.projects.filter(x=>x.id!==p.id);sel=(S.projects[0]||{}).id}
    renderAll();toast("تم التراجع عن التعديلات")};
  const del=$("#delP");del.onclick=()=>{
    if(del.dataset.arm){S.projects=S.projects.filter(x=>x.id!==p.id);sel=(S.projects[0]||{}).id;renderAll();toast("تم حذف المشروع");return}
    del.dataset.arm=1;del.textContent="اضغط للتأكيد";setTimeout(()=>{if(document.body.contains(del)){delete del.dataset.arm;del.textContent="حذف"}},3000)};
}

function editContent(){
  const c=S.content;
  $("#editor").innerHTML=`<h2>محتوى الصفحة</h2>
  <label class="fld" for="cc">اسم الشركة<input id="cc" value="${esc(c.company)}"></label>
  <label class="fld" for="ct">عنوان الواجهة<textarea id="ct">${esc(c.title)}</textarea></label>
  <label class="fld" for="cs">النص التعريفي<textarea id="cs">${esc(c.sub)}</textarea></label>
  <label class="fld" for="cb">نص الزر الرئيسي<input id="cb" value="${esc(c.cta)}"></label>`;
  [["cc","company"],["ct","title"],["cs","sub"],["cb","cta"]].forEach(([id,k])=>$("#"+id).addEventListener("input",e=>{c[k]=e.target.value;renderPreview();markDirty()}))}
function editContact(){
  const k=S.contact;
  $("#editor").innerHTML=`<h2>بيانات التواصل</h2>
  <div class="g2"><label class="fld" for="kp">رقم الجوال<input id="kp" value="${esc(k.phone)}" inputmode="tel"></label>
  <label class="fld" for="kw">رقم واتساب<input id="kw" value="${esc(k.wa)}" inputmode="tel"></label></div>
  <label class="fld" for="ke">البريد الإلكتروني<input id="ke" value="${esc(k.email)}" type="email"></label>
  <label class="fld" for="ka">العنوان<input id="ka" value="${esc(k.addr)}"></label>
  <label class="fld" for="kh">أوقات الدوام<input id="kh" value="${esc(k.hours)}"></label>
  <p class="hint">رقم واتساب هو الذي تصل إليه رسائل نموذج "ابدأ مشروعك" في الموقع.</p>`;
  [["kp","phone"],["kw","wa"],["ke","email"],["ka","addr"],["kh","hours"]].forEach(([id,key])=>$("#"+id).addEventListener("input",e=>{k[key]=e.target.value;renderPreview();markDirty()}))}

function renderAll(){renderEditor();renderPreview();markDirty()}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;tab=b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-selected",x===b)});
  renderEditor();scrollPv(tab==="projects"?"pvProjects":tab==="contact"?"pvContact":"pvTop")});
$("#publish").onclick=()=>{
  S.projects.forEach(p=>delete p.isNew);
  if(S.projects.some(p=>!p.name.trim())){toast("لا يمكن النشر: يوجد مشروع بدون اسم");return}
  pub=JSON.stringify(S);markDirty();toast("تم النشر. الموقع الآن يعرض آخر التعديلات (محاكاة).")};
$("#viewSite").onclick=e=>{e.preventDefault();$("#previewCol").scrollIntoView({behavior:"smooth",block:"start"});$("#site").scrollTo({top:0})};
renderAll();
</script>
</body>
</html>
